name: Release (Windows installer)

# Builds the Windows exe + installer and attaches both to a GitHub Release.
# Trigger by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# (workflow_dispatch lets you test the build without releasing)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (lite - no torch/ultralytics)
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 numpy opencv-python Pillow pyinstaller

      - name: Build executable (PyInstaller)
        run: pyinstaller packaging/imagedit.spec --noconfirm

      - name: Smoke test - frozen app imports
        run: |
          if (-not (Test-Path "dist/ImagEdit/ImagEdit.exe")) { exit 1 }
          if (-not (Test-Path "dist/ImagEdit/_internal/imagedit/assets/icon.png")) { exit 1 }

      - name: Determine version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            packaging\installer.iss

      - name: Zip portable build
        run: Compress-Archive -Path dist/ImagEdit -DestinationPath dist/ImagEdit-${{ steps.ver.outputs.version }}-windows-portable.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imagedit-windows
          path: |
            dist/ImagEdit-Setup-*.exe
            dist/*-windows-portable.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ImagEdit-Setup-*.exe
            dist/*-windows-portable.zip
          generate_release_notes: true
